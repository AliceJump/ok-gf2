name: PR Test

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      PYTHONIOENCODING: 'UTF-8'
      PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

    strategy:
      matrix:
        python-version: [ 3.12 ]

    steps:
      - name: Configure git
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ok-oldking@users.noreply.github.com"
          git config --global user.name "ok-oldking"
          echo "action_state=yellow" >> $env:GITHUB_ENV
          echo "${{ env.action_state }}"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          lfs: true
          fetch-depth: 0
          fetch-tags: true

      - name: Run actionlint
        shell: pwsh
        run: |
          $version = "1.7.12"
          $archive = Join-Path $env:RUNNER_TEMP "actionlint.zip"
          $toolDir = Join-Path $env:RUNNER_TEMP "actionlint"
          $expected = "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"
          $url = "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_windows_amd64.zip"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "actionlint archive checksum mismatch: $actual"
          }

          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force
          $actionlint = Get-ChildItem -LiteralPath $toolDir -Filter "actionlint.exe" -Recurse -File | Select-Object -First 1
          if (-not $actionlint) {
            throw "actionlint.exe not found in downloaded archive"
          }

          $workflowFiles = @(
            Get-ChildItem -LiteralPath ".github/workflows" -File |
              Where-Object { $_.Extension -in ".yml", ".yaml" }
          )
          if ($workflowFiles.Count -eq 0) {
            throw "No workflow YAML files found"
          }
          $workflowPaths = @($workflowFiles.FullName)
          & $actionlint.FullName @workflowPaths
          if ($LASTEXITCODE -ne 0) {
            throw "actionlint failed"
          }

      - name: Output immutable commit SHA
        id: sha
        shell: pwsh
        run: |
          "sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve branch name
        id: ref
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $raw = $env:HEAD_REF
          $raw = $raw -replace "[\r\n]", ""
          "branch=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $safe = $raw -replace '[/\\:<>*?"|]', '-'
          "safe_branch=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          pip install uv==0.12.5
          uv venv .venv
          uv pip install --python .venv packaging==26.3

      - name: Verify requirements.txt reproducible
        run: |
          uv run --locked --no-sync python scripts/release/gen_release_requirements.py --check

      - name: Install uv
        run: |
          pip install uv==0.12.5
          uv venv .venv
          uv pip install --python .venv --no-deps ok-script==2.0.5 pyappify==1.0.13

      - name: inline_ok_requirements
        env:
          RELEASE_TAG: ${{ steps.ref.outputs.branch }}
        run: |
          uv run --locked --no-sync python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install polib

      - name: Run tests
        timeout-minutes: 5
        run: |
          python -u -m unittest discover -s tests -p "Test*.py" -v
